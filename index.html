<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="monetag" content="92e56f384e0b171e578bd23c116943b4">
<script>(function(s){s.dataset.zone='11732516',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<title>GoalZone | نبض الملاعب</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff;
    --navy:#1e2a52; --navy-2:#2c3968;
    --gold:#f5b60d; --gold-deep:#d99c00;
    --text:#1c2233; --text-dim:#7b839a;
    --border:#e6e9f0; --green:#1fa855; --red:#e5484d;
    --shadow:0 2px 10px rgba(30,42,82,0.06);
  }
  [data-theme="dark"]{
    --bg:#11141d; --card:#1a1f2e;
    --navy:#151a2c; --navy-2:#1f2740;
    --text:#f0f2f8; --text-dim:#8d95ab;
    --border:#2a3145;
    --shadow:0 2px 10px rgba(0,0,0,0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;padding-bottom:76px;}
  a{color:inherit;}
  button{font-family:'Cairo',sans-serif;}

  /* ===== Header ===== */
  header{background:linear-gradient(135deg,var(--navy),var(--navy-2));position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,0.15);}
  .nav{max-width:1100px;margin:0 auto;padding:.9rem 1.1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;}
  .brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;flex-shrink:0;}
  .brand-mark{width:32px;height:32px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:1rem;}
  .brand-name{font-weight:900;font-size:1.1rem;color:#fff;}
  .brand-name span{color:var(--gold);}
  .search-box{flex:1;max-width:280px;display:flex;align-items:center;gap:.5rem;background:rgba(255,255,255,0.12);border-radius:20px;padding:.45rem .9rem;}
  .search-box input{background:none;border:none;outline:none;color:#fff;font-family:'Cairo',sans-serif;font-size:.82rem;width:100%;}
  .search-box input::placeholder{color:rgba(255,255,255,0.6);}
  .search-box i{color:rgba(255,255,255,0.7);font-size:.8rem;}
  @media(max-width:640px){ .search-box{max-width:110px;} }
  .header-icons{display:flex;gap:.4rem;flex-shrink:0;}
  .icon-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.12);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.85rem;flex-shrink:0;}
  .icon-btn.active{background:var(--gold);color:var(--navy);}

  /* ===== Bottom tab bar ===== */
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:.5rem .4rem calc(.5rem + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,0.05);}
  .tab-link{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-dim);text-decoration:none;font-size:.66rem;font-weight:700;padding:.2rem .5rem;}
  .tab-link i{font-size:1.05rem;}
  .tab-link.active{color:var(--navy);}
  .tab-cta{background:var(--gold);color:var(--navy)!important;border-radius:18px;padding:.5rem 1rem!important;font-weight:800!important;}

  .wrap{max-width:1100px;margin:0 auto;padding:1.1rem 1.1rem 2rem;}

  /* ===== Featured match (navy card, FilGoal style) ===== */
  .featured{background:linear-gradient(160deg,var(--navy),var(--navy-2));border-radius:16px;padding:1.4rem 1.2rem;margin-bottom:1.2rem;box-shadow:var(--shadow);}
  .featured-comp{text-align:center;color:rgba(255,255,255,0.7);font-size:.8rem;font-weight:700;margin-bottom:.9rem;}
  .featured-body{display:flex;align-items:center;justify-content:space-between;gap:.6rem;}
  .fteam{flex:1;display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;cursor:pointer;}
  .fteam img{width:46px;height:46px;object-fit:contain;}
  .fteam-name{font-weight:800;font-size:.86rem;color:#fff;}
  .fscore-block{display:flex;flex-direction:column;align-items:center;gap:.4rem;min-width:100px;}
  .fscore{font-size:1.9rem;font-weight:900;color:#fff;}
  .fstatus{font-size:.72rem;font-weight:700;color:var(--navy);background:var(--gold);padding:3px 12px;border-radius:20px;}
  .fstatus.idle{color:#fff;background:rgba(255,255,255,0.15);}
  .ftime{text-align:center;font-size:.72rem;color:rgba(255,255,255,0.65);margin-top:.9rem;}
  .ftv{text-align:center;font-size:.75rem;color:var(--gold);font-weight:700;margin-top:.3rem;display:flex;align-items:center;justify-content:center;gap:6px;}

  .section-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1rem;margin-bottom:.7rem;color:var(--navy);}
  .section-title i{color:var(--gold);}

  /* ===== Ticker ===== */
  .ticker{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:1.4rem;scrollbar-width:thin;}
  .tick-card{flex:0 0 auto;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.7rem .8rem;cursor:pointer;box-shadow:var(--shadow);}
  .tick-comp{font-size:.62rem;color:var(--text-dim);margin-bottom:.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tick-row{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:700;margin-bottom:2px;}
  .tick-score{color:var(--navy);font-weight:900;}

  /* ===== Competition group (FilGoal style) ===== */
  .comp-group{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:1rem;overflow:hidden;}
  .comp-head{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1rem;border-bottom:1px solid var(--border);font-weight:800;font-size:.9rem;color:var(--navy);}
  .comp-head i{color:var(--gold);}
  .match-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.9rem 1rem;border-bottom:1px solid var(--border);}
  .match-row:last-child{border-bottom:none;}
  .side{flex:1;display:flex;align-items:center;gap:.55rem;font-weight:700;font-size:.85rem;}
  .side img{width:26px;height:26px;object-fit:contain;flex-shrink:0;}
  .side.away{flex-direction:row-reverse;text-align:left;justify-content:flex-end;}
  .mid{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:70px;}
  .mid .score{font-weight:900;font-size:1.05rem;color:var(--navy);}
  .mid .time{font-size:.9rem;font-weight:800;color:var(--navy);}
  .mid .status-tag{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:10px;}
  .status-tag.live{background:rgba(229,72,77,0.12);color:var(--red);}
  .status-tag.finished{background:#f1f2f6;color:var(--text-dim);}
  .status-tag.scheduled{background:rgba(31,168,85,0.1);color:var(--green);}
  .match-tv{width:100%;text-align:center;font-size:.68rem;color:var(--text-dim);padding:0 1rem .7rem;margin-top:-.4rem;display:flex;align-items:center;justify-content:center;gap:5px;}
  .match-tv i{color:var(--gold);}

  .panel{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:1.1rem;margin-bottom:1rem;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.5rem;}
  .panel-head h2{font-size:.95rem;font-weight:800;color:var(--navy);}
  .tabs{display:flex;gap:.35rem;flex-wrap:wrap;}
  .tab-btn{background:var(--bg);border:1px solid var(--border);color:var(--text-dim);font-size:.7rem;font-weight:700;padding:5px 11px;border-radius:20px;cursor:pointer;}
  .tab-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th{text-align:right;color:var(--text-dim);font-weight:700;font-size:.68rem;padding:.4rem .3rem;border-bottom:1px solid var(--border);}
  th.c, td.c{text-align:center;}
  td{padding:.55rem .3rem;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  .team-cell{display:flex;align-items:center;gap:.5rem;font-weight:700;}
  .team-cell img{width:19px;height:19px;object-fit:contain;}
  .pos{width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;background:var(--bg);color:var(--text-dim);}
  .pos.qualify{background:rgba(31,168,85,0.12);color:var(--green);}
  .pts{font-weight:900;color:var(--navy);}

  .news-item{display:flex;gap:.8rem;padding:.8rem 0;border-bottom:1px solid var(--border);}
  .news-item:last-child{border:none;padding-bottom:0;}
  .news-icon{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:rgba(245,182,13,0.15);color:var(--gold-deep);display:flex;align-items:center;justify-content:center;font-size:1rem;}
  .news-item h4{font-size:.86rem;font-weight:700;margin-bottom:3px;color:var(--navy);}
  .news-item p{font-size:.76rem;color:var(--text-dim);line-height:1.6;}

  .empty{text-align:center;color:var(--text-dim);padding:2rem 1rem;font-size:.88rem;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .empty i{font-size:1.3rem;color:var(--gold-deep);}

  .team-hero{display:flex;align-items:center;gap:1rem;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:1.2rem;margin-bottom:1rem;}
  .team-hero img{width:60px;height:60px;object-fit:contain;}
  .team-hero h1{font-size:1.1rem;font-weight:900;color:var(--navy);}
  .team-hero p{font-size:.76rem;color:var(--text-dim);}
  .follow-btn{margin-inline-start:auto;background:var(--bg);border:1px solid var(--border);color:var(--navy);font-weight:700;font-size:.76rem;padding:6px 14px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .follow-btn.active{background:var(--gold);border-color:var(--gold);color:var(--navy);}

  .search-wrap{position:relative;}
  .search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;max-height:260px;overflow-y:auto;z-index:60;display:none;box-shadow:var(--shadow);}
  .search-results.show{display:block;}
  .search-result-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;font-size:.82rem;font-weight:600;cursor:pointer;border-bottom:1px solid var(--border);color:var(--text);}
  .search-result-item:last-child{border:none;}
  .search-result-item img{width:20px;height:20px;object-fit:contain;}

  .install-banner{display:none;align-items:center;justify-content:space-between;gap:1rem;background:var(--gold);color:var(--navy);padding:.6rem 1.1rem;font-size:.8rem;font-weight:700;}
  .install-banner.show{display:flex;}
  .install-banner button{background:var(--navy);color:var(--gold);border:none;padding:5px 12px;border-radius:16px;font-weight:700;font-size:.74rem;cursor:pointer;}
  .install-close{background:none!important;color:var(--navy)!important;font-size:1rem;padding:0!important;}

  footer{text-align:center;padding:1.3rem;color:var(--text-dim);font-size:.78rem;}
</style>
</head>
<body>

<div class="install-banner" id="installBanner">
  <span><i class="fa-solid fa-mobile-screen"></i> ثبّت GoalZone كتطبيق على موبايلك</span>
  <div style="display:flex;gap:8px;align-items:center;">
    <button id="installBtn">تثبيت</button>
    <button class="install-close" id="installClose"><i class="fa-solid fa-xmark"></i></button>
  </div>
</div>

<header>
  <div class="nav">
    <a href="#/" class="brand">
      <span class="brand-mark"><i class="fa-solid fa-futbol"></i></span>
      <span class="brand-name">Goal<span>Zone</span></span>
    </a>
    <div class="search-wrap" style="flex:1;max-width:280px;">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="دور على فريق...">
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="header-icons">
      <button class="icon-btn" id="notifBtn" title="تفعيل الإشعارات"><i class="fa-solid fa-bell"></i></button>
      <button class="icon-btn" id="themeBtn" title="الوضع الداكن"><i class="fa-solid fa-moon"></i></button>
    </div>
  </div>
</header>

<div class="wrap" id="app">
  <div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل</div>
</div>

<footer>© 2026 GoalZone — جميع الحقوق محفوظة</footer>

<nav class="tabbar">
  <a href="#/following" class="tab-link" data-route="following"><i class="fa-solid fa-bell"></i> متابعاتي</a>
  <a href="#/standings/PD" class="tab-link" data-route="standings"><i class="fa-solid fa-ranking-star"></i> الترتيب</a>
  <a href="#/matches" class="tab-link tab-cta" data-route="matches"><i class="fa-solid fa-futbol"></i> المباريات</a>
  <a href="#/" class="tab-link" data-route="home"><i class="fa-solid fa-house"></i> الرئيسية</a>
</nav>

<script>
const API_BASE = "https://goalzone-api.haleemhlmygl.workers.dev";
const COMPETITIONS = [
  {code:"PD", name:"الدوري الإسباني"},
  {code:"PL", name:"الدوري الإنجليزي"},
  {code:"SA", name:"الدوري الإيطالي"},
  {code:"BL1", name:"الدوري الألماني"},
  {code:"FL1", name:"الدوري الفرنسي"},
];
const statusMap = {
  IN_PLAY:"مباشر", PAUSED:"استراحة", SCHEDULED:"لم تبدأ", TIMED:"لم تبدأ",
  FINISHED:"انتهت", POSTPONED:"مؤجلة", SUSPENDED:"متوقفة", CANCELLED:"ملغاة"
};
const app = document.getElementById('app');
const cache = {};
let allMatchesCache = [];

function scoreOf(m){
  const h = m.score?.fullTime?.home, a = m.score?.fullTime?.away;
  return (h===null||h===undefined) ? null : `${h} - ${a}`;
}
function matchTime(m){
  if(!m.utcDate) return '';
  try{
    return new Date(m.utcDate).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', hour12:true, timeZone:'Asia/Riyadh'});
  }catch(e){ return ''; }
}
const BROADCASTERS = { PD:'beIN Sports', PL:'beIN Sports', SA:'beIN Sports', BL1:'beIN Sports', FL1:'beIN Sports', CL:'beIN Sports' };
function broadcasterOf(m){ return BROADCASTERS[m.competition?.code] || 'القنوات المحلية'; }
function statusClass(m){
  if(m.status==='IN_PLAY'||m.status==='PAUSED') return 'live';
  if(m.status==='FINISHED') return 'finished';
  return 'scheduled';
}
function midHtml(m){
  const score = scoreOf(m);
  const cls = statusClass(m);
  if(score){
    return `<div class="mid"><div class="score">${score}</div><span class="status-tag ${cls}">${statusMap[m.status]||m.status}</span></div>`;
  }
  return `<div class="mid"><div class="time">${matchTime(m)}</div><span class="status-tag ${cls}">لم تبدأ</span></div>`;
}
function matchRowHtml(m){
  return `
    <div class="match-row">
      <div class="side home" onclick="location.hash='#/team/${m.homeTeam.id}'">
        <img src="${m.homeTeam.crest||''}" onerror="this.style.visibility='hidden'">
        <span>${m.homeTeam.shortName||m.homeTeam.name}</span>
      </div>
      ${midHtml(m)}
      <div class="side away" onclick="location.hash='#/team/${m.awayTeam.id}'">
        <img src="${m.awayTeam.crest||''}" onerror="this.style.visibility='hidden'">
        <span>${m.awayTeam.shortName||m.awayTeam.name}</span>
      </div>
    </div>
    <div class="match-tv"><i class="fa-solid fa-tv"></i> ${broadcasterOf(m)} · بتوقيت الرياض ${matchTime(m)}</div>
  `;
}
function groupByCompetition(matches){
  const groups = {};
  matches.forEach(m=>{
    const name = m.competition?.name || 'أخرى';
    (groups[name] = groups[name] || []).push(m);
  });
  return groups;
}
function compGroupsHtml(matches){
  const groups = groupByCompetition(matches);
  return Object.entries(groups).map(([name, list])=>`
    <div class="comp-group">
      <div class="comp-head"><span><i class="fa-solid fa-trophy"></i> ${name}</span></div>
      ${list.map(matchRowHtml).join('')}
    </div>
  `).join('');
}

async function apiGet(path){
  if(cache[path]) return cache[path];
  const res = await fetch(`${API_BASE}${path}`);
  if(!res.ok) throw new Error("HTTP "+res.status);
  const data = await res.json();
  cache[path] = data;
  return data;
}

function getFollowing(){
  try{ return JSON.parse(localStorage.getItem('gz_following')||'[]'); }catch(e){ return []; }
}
function toggleFollow(team){
  let list = getFollowing();
  const idx = list.findIndex(t => t.id === team.id);
  if(idx>=0) list.splice(idx,1); else list.push(team);
  localStorage.setItem('gz_following', JSON.stringify(list));
  return idx<0;
}
function isFollowing(id){ return getFollowing().some(t => t.id===id); }

let lastKnownScores = {};
async function checkFollowedGoals(){
  const following = getFollowing();
  if(!following.length || Notification.permission!=='granted') return;
  try{
    const data = await fetch(`${API_BASE}/v4/matches`).then(r=>r.json());
    (data.matches||[]).forEach(m=>{
      const involved = following.some(t => t.id===m.homeTeam.id || t.id===m.awayTeam.id);
      if(!involved) return;
      const key = m.id;
      const score = scoreOf(m);
      if(lastKnownScores[key] && lastKnownScores[key] !== score && score){
        new Notification("⚽ هدف جديد!", { body: `${m.homeTeam.shortName||m.homeTeam.name} ${score} ${m.awayTeam.shortName||m.awayTeam.name}` });
      }
      lastKnownScores[key] = score;
    });
  }catch(e){ console.error(e); }
}

const routes = { home: renderHome, matches: renderMatches, standings: renderStandings, team: renderTeam, following: renderFollowing, frequencies: renderFrequencies };

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return { route: parts[0] || 'home', params: parts.slice(1) };
}

async function router(){
  const { route, params } = parseHash();
  document.querySelectorAll('.tab-link').forEach(a=>{
    a.classList.toggle('active', a.dataset.route === route || (route==='team' && a.dataset.route==='home'));
  });
  app.innerHTML = `<div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل</div>`;
  window.scrollTo(0,0);
  try{
    await (routes[route] || renderHome)(...params);
  }catch(e){
    console.error(e);
    app.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i> حصل خطأ أثناء التحميل</div>`;
  }
}
window.addEventListener('hashchange', router);

async function renderHome(){
  app.innerHTML = `
    <div class="featured" id="featuredBox">
      <div class="empty" style="color:rgba(255,255,255,0.7);"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل</div>
    </div>
    <div class="section-title"><i class="fa-solid fa-list"></i> باقي مباريات اليوم</div>
    <div class="ticker" id="tickerBox"></div>
    <div class="panel">
      <div class="panel-head">
        <h2>جدول الترتيب</h2>
        <a href="#/standings/PD" style="font-size:.75rem;color:var(--navy);font-weight:700;text-decoration:none;">عرض الكل ←</a>
      </div>
      <div id="standingsPreview"></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h2>ترددات القنوات الرياضية</h2>
        <a href="#/frequencies" style="font-size:.75rem;color:var(--navy);font-weight:700;text-decoration:none;">عرض الكل ←</a>
      </div>
      ${frequenciesTableHtml(3)}
    </div>
    <div class="panel">
      <div class="panel-head">
        <h2>آخر الأخبار</h2>
        <a href="اخبار/index.html" style="font-size:.75rem;color:var(--navy);font-weight:700;text-decoration:none;">عرض الكل ←</a>
      </div>
      <div class="news-item"><div class="news-icon"><i class="fa-solid fa-medal"></i></div><div><h4>صراع محتدم على صدارة الليجا</h4><p>منافسة قوية بين أندية القمة الإسبانية مع اقتراب منتصف الموسم.</p></div></div>
      <div class="news-item"><div class="news-icon"><i class="fa-solid fa-fire-flame-curved"></i></div><div><h4>البريميرليج يشتعل في القمة</h4><p>تقارب كبير في النقاط بين الفرق الأولى يجعل كل جولة حاسمة.</p></div></div>
    </div>
  `;
  loadFeaturedAndTicker();
  loadStandingsPreview('PD');
}

async function loadFeaturedAndTicker(){
  try{
    const data = await apiGet('/v4/matches');
    const matches = data.matches || [];
    allMatchesCache = matches;
    const box = document.getElementById('featuredBox');
    if(!box) return;
    if(!matches.length){
      box.innerHTML = `<div class="empty" style="color:rgba(255,255,255,0.7);"><i class="fa-solid fa-calendar-xmark"></i> لا توجد مباريات مجدولة اليوم</div>`;
      document.getElementById('tickerBox').innerHTML = '';
      return;
    }
    const live = matches.find(m=>m.status==='IN_PLAY'||m.status==='PAUSED');
    const featured = live || matches[0];
    const isLive = featured.status==='IN_PLAY'||featured.status==='PAUSED';
    const score = scoreOf(featured);
    box.innerHTML = `
      <div class="featured-comp">${featured.competition?.name||''}</div>
      <div class="featured-body">
        <div class="fteam" onclick="location.hash='#/team/${featured.homeTeam.id}'">
          <img src="${featured.homeTeam.crest||''}" onerror="this.style.visibility='hidden'">
          <span class="fteam-name">${featured.homeTeam.shortName||featured.homeTeam.name}</span>
        </div>
        <div class="fscore-block">
          <div class="fscore">${score || matchTime(featured)}</div>
          <div class="fstatus ${isLive?'':'idle'}">${statusMap[featured.status]||featured.status}</div>
        </div>
        <div class="fteam" onclick="location.hash='#/team/${featured.awayTeam.id}'">
          <img src="${featured.awayTeam.crest||''}" onerror="this.style.visibility='hidden'">
          <span class="fteam-name">${featured.awayTeam.shortName||featured.awayTeam.name}</span>
        </div>
      </div>
      <div class="ftime">${matchTime(featured)} بتوقيت الرياض</div>
      <div class="ftv"><i class="fa-solid fa-tv"></i> ${broadcasterOf(featured)}</div>
    `;
    const rest = matches.filter(m=>m!==featured);
    const tbox = document.getElementById('tickerBox');
    tbox.innerHTML = rest.length ? rest.map(m=>`
      <div class="tick-card" onclick="location.hash='#/team/${m.homeTeam.id}'">
        <div class="tick-comp">${m.competition?.name||''}</div>
        <div class="tick-row"><span>${m.homeTeam.shortName||m.homeTeam.name}</span><span class="tick-score">${scoreOf(m)? scoreOf(m).split(' - ')[0] : '-'}</span></div>
        <div class="tick-row"><span>${m.awayTeam.shortName||m.awayTeam.name}</span><span class="tick-score">${scoreOf(m)? scoreOf(m).split(' - ')[1] : '-'}</span></div>
      </div>
    `).join('') : `<div class="empty" style="width:100%"><i class="fa-solid fa-mug-hot"></i> لا توجد مباريات إضافية</div>`;
  }catch(e){
    console.error(e);
    const box = document.getElementById('featuredBox');
    if(box) box.innerHTML = `<div class="empty" style="color:rgba(255,255,255,0.7);"><i class="fa-solid fa-triangle-exclamation"></i> تعذر الاتصال بالخادم</div>`;
  }
}

async function loadStandingsPreview(code){
  const box = document.getElementById('standingsPreview');
  if(!box) return;
  try{
    const data = await apiGet(`/v4/competitions/${code}/standings`);
    const table = data.standings?.find(s=>s.type==='TOTAL')?.table || [];
    if(!table.length){ box.innerHTML = `<div class="empty"><i class="fa-solid fa-lock"></i> غير متاح في الباقة المجانية</div>`; return; }
    box.innerHTML = standingsTableHtml(table.slice(0,5));
  }catch(e){
    box.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i> تعذر التحميل</div>`;
  }
}

function standingsTableHtml(table){
  return `<table><thead><tr><th>#</th><th>الفريق</th><th class="c">لعب</th><th class="c">فرق</th><th class="c">نقاط</th></tr></thead><tbody>
    ${table.map(row=>`
      <tr class="clickable" onclick="location.hash='#/team/${row.team.id}'">
        <td><span class="pos ${row.position<=4?'qualify':''}">${row.position}</span></td>
        <td><div class="team-cell"><img src="${row.team.crest||''}" onerror="this.style.visibility='hidden'">${row.team.shortName||row.team.name}</div></td>
        <td class="c">${row.playedGames}</td><td class="c">${row.goalDifference}</td><td class="c pts">${row.points}</td>
      </tr>`).join('')}
  </tbody></table>`;
}

/* ===== Satellite channel frequencies =====
   القيم فاضية عمداً لحد ما تتأكد منها من مصدر موثوق (الترددات بتتغير بمرور الوقت).
   عدّل المصفوفة دي وحط الأرقام الصح، كل صف = قناة. */
const CHANNELS = [
  { name:"beIN Sports 1 HD",  sat:"Eutelsat 7W (نايل سات)", freq:"—", pol:"—", sr:"—" },
  { name:"beIN Sports 2 HD",  sat:"Eutelsat 7W (نايل سات)", freq:"—", pol:"—", sr:"—" },
  { name:"beIN Sports MAX 1", sat:"Eutelsat 7W (نايل سات)", freq:"—", pol:"—", sr:"—" },
  { name:"ON Time Sport",     sat:"نايل سات",               freq:"—", pol:"—", sr:"—" },
  { name:"SSC 1 HD",          sat:"عرب سات",                freq:"—", pol:"—", sr:"—" },
];
function frequenciesTableHtml(limit){
  const rows = limit ? CHANNELS.slice(0, limit) : CHANNELS;
  return `
    <table>
      <thead><tr><th>القناة</th><th>القمر</th><th class="c">التردد</th><th class="c">الاستقطاب</th><th class="c">الترميز</th></tr></thead>
      <tbody>
        ${rows.map(c=>`
          <tr>
            <td style="font-weight:700;">${c.name}</td>
            <td style="font-size:.78rem;color:var(--text-dim);">${c.sat}</td>
            <td class="c">${c.freq}</td>
            <td class="c">${c.pol}</td>
            <td class="c">${c.sr}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <p style="font-size:.72rem;color:var(--text-dim);margin-top:.7rem;line-height:1.7;">
      ⚠️ الترددات تتغير من وقت لآخر حسب تحديثات الأقمار الصناعية. تأكد منها من مصدر رسمي قبل الاعتماد عليها في ضبط الرسيفر.
    </p>
  `;
}

async function renderTeam(id){
  if(!id){ location.hash='#/'; return; }
  app.innerHTML = `<div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل</div>`;
  try{
    const team = await apiGet(`/v4/teams/${id}`);
    const following = isFollowing(Number(id));
    app.innerHTML = `
      <div class="team-hero">
        <img src="${team.crest||''}" onerror="this.style.visibility='hidden'">
        <div>
          <h1>${team.name}</h1>
          <p>${team.area?.name||''} ${team.founded?'· تأسس '+team.founded:''}</p>
        </div>
        <button class="follow-btn ${following?'active':''}" id="followBtn">
          <i class="fa-solid ${following?'fa-bell':'fa-bell-slash'}"></i> ${following?'بتتابعه':'تابع'}
        </button>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>آخر المباريات</h2></div>
        <div id="teamMatches"><div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل</div></div>
      </div>
    `;
    document.getElementById('followBtn').addEventListener('click', ()=>{
      const nowFollowing = toggleFollow({id: team.id, name: team.shortName||team.name, crest: team.crest});
      if(nowFollowing && Notification.permission!=='granted') Notification.requestPermission();
      renderTeam(id);
    });
    const mbox = document.getElementById('teamMatches');
    try{
      const mdata = await apiGet(`/v4/teams/${id}/matches?limit=8`);
      const matches = mdata.matches || [];
      mbox.innerHTML = matches.length ? matches.slice(0,8).map(matchRowHtml).join('') : `<div class="empty"><i class="fa-solid fa-calendar-xmark"></i> لا توجد مباريات حديثة</div>`;
    }catch(e){
      mbox.innerHTML = `<div class="empty"><i class="fa-solid fa-lock"></i> بيانات المباريات غير متاحة لهذا الفريق حالياً</div>`;
    }
  }catch(e){
    app.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i> تعذر تحميل بيانات الفريق</div>`;
  }
}

const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let searchTimeout;
searchInput.addEventListener('input', ()=>{
  clearTimeout(searchTimeout);
  const q = searchInput.value.trim();
  if(q.length < 2){ searchResults.classList.remove('show'); return; }
  searchTimeout = setTimeout(()=>doSearch(q), 300);
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-wrap')) searchResults.classList.remove('show');
});
function doSearch(q){
  const teamsMap = new Map();
  allMatchesCache.forEach(m=>{
    [m.homeTeam, m.awayTeam].forEach(t=>{
      if(t.name.toLowerCase().includes(q.toLowerCase()) || (t.shortName||'').toLowerCase().includes(q.toLowerCase())){
        teamsMap.set(t.id, t);
      }
    });
  });
  const results = Array.from(teamsMap.values());
  searchResults.innerHTML = results.length ? results.map(t=>`
    <div class="search-result-item" onclick="location.hash='#/team/${t.id}'; searchResults.classList.remove('show'); searchInput.value='';">
      <img src="${t.crest||''}" onerror="this.style.visibility='hidden'">${t.shortName||t.name}
    </div>
  `).join('') : `<div class="search-result-item" style="cursor:default;color:var(--text-dim);">مفيش نتائج ضمن مباريات اليوم</div>`;
  searchResults.classList.add('show');
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  document.getElementById('installBanner').classList.remove('show');
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
});
document.getElementById('installClose').addEventListener('click', ()=>{
  document.getElementById('installBanner').classList.remove('show');
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ===== Header notification button ===== */
const notifBtn = document.getElementById('notifBtn');
function refreshNotifBtn(){
  if('Notification' in window && Notification.permission === 'granted'){
    notifBtn.classList.add('active');
    notifBtn.title = 'الإشعارات مفعّلة';
  }
}
notifBtn.addEventListener('click', async ()=>{
  if(!('Notification' in window)){ return; }
  if(Notification.permission === 'granted'){
    alert('الإشعارات مفعّلة بالفعل. تابع فرقك من صفحة "متابعاتي" عشان توصلك تنبيهات أهدافها.');
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm === 'granted') refreshNotifBtn();
});
refreshNotifBtn();

/* ===== Dark mode toggle ===== */
const themeBtn = document.getElementById('themeBtn');
function applyTheme(theme){
  if(theme === 'dark'){
    document.documentElement.dataset.theme = 'dark';
    themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
  }else{
    delete document.documentElement.dataset.theme;
    themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
  }
}
const savedTheme = localStorage.getItem('gz_theme') || 'light';
applyTheme(savedTheme);
themeBtn.addEventListener('click', ()=>{
  const current = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('gz_theme', next);
  applyTheme(next);
});

router();
setInterval(()=>{ if(parseHash().route==='home') loadFeaturedAndTicker(); }, 90000);
setInterval(checkFollowedGoals, 60000);
