<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12100e">
<meta name="monetag" content="92e56f384e0b171e578bd23c116943b4">
<script>(function(s){s.dataset.zone='11732516',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<title>GoalZone | نبض الملاعب</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
  :root{
    --bg:#12100e; --bg-raised:#1b1815; --bg-raised-2:#221e19;
    --line:rgba(255,255,255,0.08);
    --gold:#f2b039; --gold-deep:#c8862a;
    --crimson:#e14b4b; --ink:#f4efe8; --ink-dim:#a89e90; --pitch:#2f9e63;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:radial-gradient(1200px 500px at 15% -10%, rgba(242,176,57,0.08), transparent 60%),var(--bg);
    color:var(--ink);font-family:'Cairo',sans-serif;-webkit-font-smoothing:antialiased;
    padding-bottom:70px;
  }
  a{color:inherit;}
  button{font-family:'Cairo',sans-serif;}

  header{border-bottom:1px solid var(--line);background:rgba(18,16,14,0.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50;}
  .nav{max-width:1100px;margin:0 auto;padding:.9rem 1.1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;}
  .brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;flex-shrink:0;}
  .brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(145deg,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;color:#1a1408;font-size:1rem;}
  .brand-name{font-weight:900;font-size:1.15rem;letter-spacing:.3px;}
  .brand-name span{color:var(--gold);}
  .search-box{flex:1;max-width:280px;display:flex;align-items:center;gap:.5rem;background:var(--bg-raised);border:1px solid var(--line);border-radius:20px;padding:.4rem .9rem;}
  .search-box input{background:none;border:none;outline:none;color:var(--ink);font-family:'Cairo',sans-serif;font-size:.82rem;width:100%;}
  .search-box i{color:var(--ink-dim);font-size:.8rem;}
  @media(max-width:640px){ .search-box{max-width:130px;} }

  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(18,16,14,0.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:.5rem 0 calc(.5rem + env(safe-area-inset-bottom));}
  .tab-link{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-dim);text-decoration:none;font-size:.68rem;font-weight:700;padding:.2rem .6rem;}
  .tab-link i{font-size:1.05rem;}
  .tab-link.active{color:var(--gold);}

  .wrap{max-width:1100px;margin:0 auto;padding:1.4rem 1.1rem 2.5rem;}

  .featured{background:linear-gradient(160deg,var(--bg-raised-2),var(--bg-raised));border:1px solid var(--line);border-radius:18px;padding:1.7rem 1.5rem;margin-bottom:1.6rem;position:relative;overflow:hidden;}
  .featured::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 90% 0%, rgba(242,176,57,0.10), transparent 70%);pointer-events:none;}
  .featured-label{font-size:.8rem;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:1rem;}
  .featured-body{display:flex;align-items:center;justify-content:space-between;gap:.8rem;}
  .fteam{flex:1;display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;cursor:pointer;}
  .fteam img{width:48px;height:48px;object-fit:contain;}
  .fteam-name{font-weight:800;font-size:.88rem;}
  .fscore-block{display:flex;flex-direction:column;align-items:center;gap:.3rem;min-width:100px;}
  .fscore{font-family:'Oswald',sans-serif;font-size:2.3rem;font-weight:700;letter-spacing:2px;}
  .fstatus{font-size:.7rem;font-weight:700;color:var(--crimson);background:rgba(225,75,75,0.12);border:1px solid rgba(225,75,75,0.3);padding:2px 10px;border-radius:20px;}
  .fstatus.idle{color:var(--ink-dim);background:transparent;border-color:var(--line);}
  .fcomp{text-align:center;font-size:.72rem;color:var(--ink-dim);margin-top:.9rem;}

  .section-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1rem;margin-bottom:.8rem;}
  .section-title i{color:var(--gold);}

  .ticker{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:1.8rem;scrollbar-width:thin;}
  .ticker::-webkit-scrollbar{height:5px;}
  .ticker::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
  .tick-card{flex:0 0 auto;min-width:150px;background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;cursor:pointer;}
  .tick-comp{font-size:.65rem;color:var(--ink-dim);margin-bottom:.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tick-row{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;font-weight:700;margin-bottom:2px;}
  .tick-score{font-family:'Oswald',sans-serif;color:var(--gold);}

  .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:1.4rem;}
  @media(max-width:820px){.grid{grid-template-columns:1fr;}}

  .panel{background:var(--bg-raised);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.1rem;margin-bottom:1.4rem;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9rem;padding-bottom:.7rem;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:.5rem;}
  .panel-head h2{font-size:1rem;font-weight:800;}
  .tabs{display:flex;gap:.35rem;flex-wrap:wrap;}
  .tab-btn{background:transparent;border:1px solid var(--line);color:var(--ink-dim);font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:20px;cursor:pointer;}
  .tab-btn.active{background:var(--gold);border-color:var(--gold);color:#1a1408;}

  table{width:100%;border-collapse:collapse;font-size:.84rem;}
  th{text-align:right;color:var(--ink-dim);font-weight:600;font-size:.7rem;padding:.4rem .3rem;border-bottom:1px solid var(--line);}
  th.c, td.c{text-align:center;}
  td{padding:.5rem .3rem;border-bottom:1px solid rgba(255,255,255,0.04);}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:rgba(255,255,255,0.02);}
  .team-cell{display:flex;align-items:center;gap:.5rem;font-weight:700;}
  .team-cell img{width:19px;height:19px;object-fit:contain;}
  .pos{width:19px;height:19px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:var(--ink-dim);}
  .pos.qualify{background:rgba(47,158,99,0.18);color:var(--pitch);}
  .pts{font-weight:800;color:var(--gold);font-family:'Oswald',sans-serif;}

  .match-list-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.85rem 0;border-bottom:1px solid var(--line);}
  .match-list-row:last-child{border:none;}
  .match-teams{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:700;}
  .match-comp{font-size:.68rem;color:var(--ink-dim);font-weight:600;}
  .match-score{font-family:'Oswald',sans-serif;font-size:1.1rem;color:var(--gold);}
  .match-extra{font-size:.68rem;color:var(--ink-dim);display:flex;align-items:center;gap:6px;margin-top:2px;}
  .match-extra i{color:var(--gold);font-size:.65rem;}
  .tv-note{font-size:.65rem;color:var(--ink-dim);text-align:center;margin-top:.6rem;opacity:.7;}

  .news-item{display:flex;gap:.9rem;padding:.9rem 0;border-bottom:1px solid var(--line);}
  .news-item:last-child{border:none;padding-bottom:0;}
  .news-icon{width:40px;height:40px;border-radius:10px;flex-shrink:0;background:rgba(242,176,57,0.1);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.05rem;}
  .news-item h4{font-size:.9rem;font-weight:700;margin-bottom:3px;}
  .news-item p{font-size:.78rem;color:var(--ink-dim);line-height:1.6;}

  .empty{text-align:center;color:var(--ink-dim);padding:2rem 1rem;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .empty i{font-size:1.3rem;color:var(--gold);}

  .team-hero{display:flex;align-items:center;gap:1rem;background:var(--bg-raised);border:1px solid var(--line);border-radius:16px;padding:1.3rem;margin-bottom:1.4rem;}
  .team-hero img{width:64px;height:64px;object-fit:contain;}
  .team-hero h1{font-size:1.2rem;font-weight:900;}
  .team-hero p{font-size:.78rem;color:var(--ink-dim);}
  .follow-btn{margin-inline-start:auto;background:transparent;border:1px solid var(--gold);color:var(--gold);font-weight:700;font-size:.78rem;padding:6px 14px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .follow-btn.active{background:var(--gold);color:#1a1408;}

  .search-wrap{position:relative;}
  .search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg-raised-2);border:1px solid var(--line);border-radius:12px;max-height:260px;overflow-y:auto;z-index:60;display:none;}
  .search-results.show{display:block;}
  .search-result-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;font-size:.82rem;font-weight:600;cursor:pointer;border-bottom:1px solid var(--line);}
  .search-result-item:last-child{border:none;}
  .search-result-item img{width:20px;height:20px;object-fit:contain;}
  .search-result-item:hover{background:rgba(255,255,255,0.03);}

  .install-banner{display:none;align-items:center;justify-content:space-between;gap:1rem;background:linear-gradient(90deg,var(--gold),var(--gold-deep));color:#1a1408;padding:.7rem 1.1rem;font-size:.82rem;font-weight:700;}
  .install-banner.show{display:flex;}
  .install-banner button{background:#1a1408;color:var(--gold);border:none;padding:5px 12px;border-radius:16px;font-weight:700;font-size:.75rem;cursor:pointer;}
  .install-close{background:none!important;color:#1a1408!important;font-size:1rem;padding:0!important;}

  footer{border-top:1px solid var(--line);text-align:center;padding:1.3rem;color:var(--ink-dim);font-size:.82rem;}
</style>
</head>
<body>

<div class="install-banner" id="installBanner">
  <span><i class="fa-solid fa-mobile-screen"></i> ثبّت GoalZone كتطبيق على موبايلك</span>
  <div style="display:flex;gap:8px;align-items:center;">
    <button id="installBtn">تثبيت</button>
    <button class="install-close" id="installClose"><i class="fa-solid fa-xmark"></i></button>
  </div>
</div>

<header>
  <div class="nav">
    <a href="#/" class="brand">
      <span class="brand-mark"><i class="fa-solid fa-futbol"></i></span>
      <span class="brand-name">Goal<span>Zone</span></span>
    </a>
    <div class="search-wrap" style="flex:1;max-width:280px;">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="دور على فريق...">
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
</header>

<div class="wrap" id="app">
  <div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل</div>
</div>

<footer>© 2026 GoalZone — جميع الحقوق محفوظة</footer>

<nav class="tabbar">
  <a href="#/" class="tab-link" data-route="home"><i class="fa-solid fa-house"></i> الرئيسية</a>
  <a href="#/matches" class="tab-link" data-route="matches"><i class="fa-solid fa-futbol"></i> المباريات</a>
  <a href="#/standings/PD" class="tab-link" data-route="standings"><i class="fa-solid fa-ranking-star"></i> الترتيب</a>
  <a href="#/following" class="tab-link" data-route="following"><i class="fa-solid fa-bell"></i> متابعاتي</a>
</nav>

<script>
const API_BASE = "https://goalzone-api.haleemhlmygl.workers.dev";
const COMPETITIONS = [
  {code:"PD", name:"الدوري الإسباني"},
  {code:"PL", name:"الدوري الإنجليزي"},
  {code:"SA", name:"الدوري الإيطالي"},
  {code:"BL1", name:"الدوري الألماني"},
  {code:"FL1", name:"الدوري الفرنسي"},
];
const statusMap = {
  IN_PLAY:"مباشر", PAUSED:"استراحة", SCHEDULED:"لم تبدأ", TIMED:"لم تبدأ",
  FINISHED:"انتهت", POSTPONED:"مؤجلة", SUSPENDED:"متوقفة", CANCELLED:"ملغاة"
};
const app = document.getElementById('app');
const cache = {};
let allMatchesCache = [];

function scoreOf(m){
  const h = m.score?.fullTime?.home, a = m.score?.fullTime?.away;
  return (h===null||h===undefined) ? "- : -" : `${h} : ${a}`;
}

// وقت المباراة بتوقيت الرياض (UTC+3)
function matchTime(m){
  if(!m.utcDate) return '';
  try{
    return new Date(m.utcDate).toLocaleTimeString('ar-EG', {
      hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Riyadh'
    });
  }catch(e){ return ''; }
}

// القناة المتوقعة حسب البطولة (تقريبية، قد تختلف الحقوق الفعلية حسب الدولة والموسم)
const BROADCASTERS = {
  PD: 'beIN Sports', PL: 'beIN Sports', SA: 'beIN Sports',
  BL1: 'beIN Sports', FL1: 'beIN Sports', CL: 'beIN Sports'
};
function broadcasterOf(m){
  return BROADCASTERS[m.competition?.code] || 'القنوات المحلية';
}
function matchExtraHtml(m){
  return `<div class="match-extra"><i class="fa-solid fa-clock"></i> ${matchTime(m)} (توقيت الرياض) · <i class="fa-solid fa-tv"></i> ${broadcasterOf(m)}</div>`;
}

async function apiGet(path){
  if(cache[path]) return cache[path];
  const res = await fetch(`${API_BASE}${path}`);
  if(!res.ok) throw new Error("HTTP "+res.status);
  const data = await res.json();
  cache[path] = data;
  return data;
}

function getFollowing(){
  try{ return JSON.parse(localStorage.getItem('gz_following')||'[]'); }catch(e){ return []; }
}
function toggleFollow(team){
  let list = getFollowing();
  const idx = list.findIndex(t => t.id === team.id);
  if(idx>=0) list.splice(idx,1); else list.push(team);
  localStorage.setItem('gz_following', JSON.stringify(list));
  return idx<0;
}
function isFollowing(id){ return getFollowing().some(t => t.id===id); }

let lastKnownScores = {};
async function checkFollowedGoals(){
  const following = getFollowing();
  if(!following.length || Notification.permission!=='granted') return;
  try{
    const data = await fetch(`${API_BASE}/v4/matches`).then(r=>r.json());
    (data.matches||[]).forEach(m=>{
      const involved = following.some(t => t.id===m.homeTeam.id || t.id===m.awayTeam.id);
      if(!involved) return;
      const key = m.id;
      const score = scoreOf(m);
      if(lastKnownScores[key] && lastKnownScores[key] !== score && score !== "- : -"){
        new Notification("⚽ هدف جديد!", {
          body: `${m.homeTeam.shortName||m.homeTeam.name} ${score} ${m.awayTeam.shortName||m.awayTeam.name}`
        });
      }
      lastKnownScores[key] = score;
    });
  }catch(e){ console.error(e); }
}

const routes = { home: renderHome, matches: renderMatches, standings: renderStandings, team: renderTeam, following: renderFollowing };

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return { route: parts[0] || 'home', params: parts.slice(1) };
}

async function router(){
  const { route, params } = parseHash();
  document.querySelectorAll('.tab-link').forEach(a=>{
    a.classList.toggle('active', a.dataset.route === route || (route==='team' && a.dataset.route==='home'));
  });
  app.innerHTML = `<div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل</div>`;
  window.scrollTo(0,0);
  try{
    await (routes[route] || renderHome)(...params);
  }catch(e){
    console.error(e);
    app.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i> حصل خطأ أثناء التحميل</div>`;
  }
}
window.addEventListener('hashchange', router);

async function renderHome(){
  app.innerHTML = `
    <div class="featured" id="featuredBox">
      <div class="featured-label"><i class="fa-solid fa-star"></i> مباراة اليوم</div>
      <div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل</div>
    </div>
    <div class="section-title"><i class="fa-solid fa-list"></i> باقي مباريات اليوم</div>
    <div class="ticker" id="tickerBox"></div>
    <div class="grid">
      <div>
        <div class="panel">
          <div class="panel-head">
            <h2>جدول الترتيب</h2>
            <a href="#/standings/PD" style="font-size:.75rem;color:var(--gold);font-weight:700;text-decoration:none;">عرض الكل ←</a>
          </div>
          <div id="standingsPreview"></div>
        </div>
      </div>
      <div>
        <div class="panel">
          <div class="panel-head"><h2>آخر الأخبار</h2></div>
          <div class="news-item"><div class="news-icon"><i class="fa-solid fa-medal"></i></div><div><h4>صراع محتدم على صدارة الليجا</h4><p>منافسة قوية بين أندية القمة الإسبانية مع اقتراب منتصف الموسم.</p></div></div>
          <div class="news-item"><div class="news-icon"><i class="fa-solid fa-fire-flame-curved"></i></div><div><h4>البريميرليج يشتعل في القمة</h4><p>تقارب كبير في النقاط بين الفرق الأولى يجعل كل جولة حاسمة.</p></div></div>
          <div class="news-item"><div class="news-icon"><i class="fa-solid fa-chart-line"></i></div><div><h4>أرقام قياسية في الدوريات الكبرى</h4><p>موسم استثنائي من حيث عدد الأهداف في البطولات الأوروبية الخمس.</p></div></div>
        </div>
      </div>
    </div>
  `;
  loadFeaturedAndTicker();
  loadStandingsPreview('PD');
}

async function loadFeaturedAndTicker(){
  try{
    const data = await apiGet('/v4/matches');
    const matches = data.matches || [];
    allMatchesCache = matches;
    const box = document.getElementById('featuredBox');
    if(!box) return;
    if(!matches.length){
      box.innerHTML = `<div class="empty"><i class="fa-solid fa-calendar-xmark"></i> لا توجد مباريات مجدولة اليوم</div>`;
      document.getElementById('tickerBox').innerHTML = '';
      return;
    }
    const live = matches.find(m=>m.status==='IN_PLAY'||m.status==='PAUSED');
    const featured = live || matches[0];
    const isLive = featured.status==='IN_PLAY'||featured.status==='PAUSED';
    box.innerHTML = `
      <div class="featured-label"><i class="fa-solid fa-star"></i> مباراة اليوم</div>
      <div class="featured-body">
        <div class="fteam" onclick="location.hash='#/team/${featured.homeTeam.id}'">
          <img src="${featured.homeTeam.crest||''}" onerror="this.style.display='none'">
          <span class="fteam-name">${featured.homeTeam.shortName||featured.homeTeam.name}</span>
        </div>
        <div class="fscore-block">
          <div class="fscore">${scoreOf(featured)}</div>
          <div class="fstatus ${isLive?'':'idle'}">${statusMap[featured.status]||featured.status}</div>
        </div>
        <div class="fteam" onclick="location.hash='#/team/${featured.awayTeam.id}'">
          <img src="${featured.awayTeam.crest||''}" onerror="this.style.display='none'">
          <span class="fteam-name">${featured.awayTeam.shortName||featured.awayTeam.name}</span>
        </div>
      </div>
      <div class="fcomp">${featured.competition?.name||''}</div>
      <div class="tv-note"><i class="fa-solid fa-clock"></i> ${matchTime(featured)} بتوقيت الرياض · <i class="fa-solid fa-tv"></i> ${broadcasterOf(featured)}</div>
    `;
    const rest = matches.filter(m=>m!==featured);
    const tbox = document.getElementById('tickerBox');
    tbox.innerHTML = rest.length ? rest.map(m=>`
      <div class="tick-card" onclick="location.hash='#/team/${m.homeTeam.id}'">
        <div class="tick-comp">${m.competition?.name||''}</div>
        <div class="tick-row"><span>${m.homeTeam.shortName||m.homeTeam.name}</span><span class="tick-score">${scoreOf(m).split(' : ')[0]}</span></div>
        <div class="tick-row"><span>${m.awayTeam.shortName||m.awayTeam.name}</span><span class="tick-score">${scoreOf(m).split(' : ')[1]}</span></div>
        ${matchExtraHtml(m)}
      </div>
    `).join('') : `<div class="empty" style="width:100%"><i class="fa-solid fa-mug-hot"></i> لا توجد مباريات إضافية</div>`;
  }catch(e){
    console.error(e);
    const box = document.getElementById('featuredBox');
    if(box) box.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i> تعذر الاتصال بالخادم</div>`;
  }
}

async function loadStandingsPreview(code){
  const box = document.getElementById('standingsPreview');
  if(!box) return;
  try{
    const data = await apiGet(`/v4/competitions/${code}/standings`);
    const table = data.standings?.find(s=>s.type==='TOTAL')?.table || [];
    if(!table.length){ box.innerHTML = `<div class="empty"><i class="fa-solid fa-lock"></i> غير متاح في الباقة المجانية</div>`; return; }
    box.innerHTML = standingsTableHtml(table.slice(0,5));
  }catch(e){
    box.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i> تعذر التحميل</div>`;
  }
}

function standingsTableHtml(table){
  return `<table><thead><tr><th>#</th><th>الفريق</th><th class="c">لعب</th><th class="c">فرق</th><th class="c">نقاط</th></tr></thead><tbody>
    ${table.map(row=>`
      <tr class="clickable" onclick="location.hash='#/team/${row.team.id}'">
        <td><span class="pos ${row.position<=4?'qualify':''}">${row.position}</span></td>
        <td><div class="team-cell"><img src="${row.team.crest||''}" onerror="this.style.display='none'">${row.team.shortName||row.team.name}</div></td>
        <td class="c">${row.playedGames}</td><td class="c">${row.goalDifference}</td><td class="c pts">${row.points}</td>
      </tr>`).join('')}
  </tbody></table>`;
}

async function renderStandings(code = 'PD'){
  app.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>جدول الترتيب</h2>
        <div class="tabs">
          ${COMPETITIONS.map(c=>`<button class="tab-btn ${c.code===code?'active':''}" onclick="location.hash='#/standings/${c.code}'">${c.name}</button>`).join('')}
        </div>
      </div>
      <div id="fullStandings"><div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل</div></div>
    </div>
  `;
  const box = document.getElementById('fullStandings');
  try{
    const data = await apiGet(`/v4/competitions/${code}/standings`);
    const table = data.standings?.find(s=>s.type==='TOTAL')?.table || [];
    box.innerHTML = table.length ? standingsTableHtml(table) : `<div class="empty"><i class="fa-solid fa-lock"></i> غير متاح في الباقة المجانية حالياً</div>`;
  }catch(e){
    box.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i> تعذر تحميل الترتيب</div>`;
  }
}

async function renderMatches(){
  app.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>كل مباريات اليوم</h2></div>
      <div id="matchesList"><div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل</div></div>
    </div>
  `;
  const box = document.getElementById('matchesList');
  try{
    const data = await apiGet('/v4/matches');
    const matches = data.matches || [];
    allMatchesCache = matches;
    if(!matches.length){ box.innerHTML = `<div class="empty"><i class="fa-solid fa-calendar-xmark"></i> لا توجد مباريات اليوم</div>`; return; }
    box.innerHTML = matches.map(m=>`
      <div class="match-list-row">
        <div class="match-teams">
          <span class="match-comp">${m.competition?.name||''}</span>
          <span onclick="location.hash='#/team/${m.homeTeam.id}'" style="cursor:pointer;">${m.homeTeam.shortName||m.homeTeam.name}</span>
          <span onclick="location.hash='#/team/${m.awayTeam.id}'" style="cursor:pointer;">${m.awayTeam.shortName||m.awayTeam.name}</span>
          ${matchExtraHtml(m)}
        </div>
        <div style="text-align:left;">
          <div class="match-score">${scoreOf(m)}</div>
          <div style="font-size:.68rem;color:var(--ink-dim);">${statusMap[m.status]||m.status}</div>
        </div>
      </div>
    `).join('');
  }catch(e){
    box.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i> تعذر تحميل المباريات</div>`;
  }
}

async function renderTeam(id){
  if(!id){ location.hash='#/'; return; }
  app.innerHTML = `<div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل</div>`;
  try{
    const team = await apiGet(`/v4/teams/${id}`);
    const following = isFollowing(Number(id));
    app.innerHTML = `
      <div class="team-hero">
        <img src="${team.crest||''}" onerror="this.style.display='none'">
        <div>
          <h1>${team.name}</h1>
          <p>${team.area?.name||''} ${team.founded?'· تأسس '+team.founded:''}</p>
        </div>
        <button class="follow-btn ${following?'active':''}" id="followBtn">
          <i class="fa-solid ${following?'fa-bell':'fa-bell-slash'}"></i>
          ${following?'بتتابعه':'تابع'}
        </button>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>آخر المباريات</h2></div>
        <div id="teamMatches"><div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل</div></div>
      </div>
    `;
    document.getElementById('followBtn').addEventListener('click', ()=>{
      const nowFollowing = toggleFollow({id: team.id, name: team.shortName||team.name, crest: team.crest});
      if(nowFollowing && Notification.permission!=='granted') Notification.requestPermission();
      renderTeam(id);
    });
    const mbox = document.getElementById('teamMatches');
    try{
      const mdata = await apiGet(`/v4/teams/${id}/matches?limit=8`);
      const matches = mdata.matches || [];
      mbox.innerHTML = matches.length ? matches.slice(0,8).map(m=>`
        <div class="match-list-row">
          <div class="match-teams">
            <span class="match-comp">${m.competition?.name||''}</span>
            <span>${m.homeTeam.shortName||m.homeTeam.name} × ${m.awayTeam.shortName||m.awayTeam.name}</span>
            ${matchExtraHtml(m)}
          </div>
          <div style="text-align:left;">
            <div class="match-score">${scoreOf(m)}</div>
            <div style="font-size:.68rem;color:var(--ink-dim);">${statusMap[m.status]||m.status}</div>
          </div>
        </div>
      `).join('') : `<div class="empty"><i class="fa-solid fa-calendar-xmark"></i> لا توجد مباريات حديثة</div>`;
    }catch(e){
      mbox.innerHTML = `<div class="empty"><i class="fa-solid fa-lock"></i> بيانات المباريات غير متاحة لهذا الفريق حالياً</div>`;
    }
  }catch(e){
    app.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i> تعذر تحميل بيانات الفريق</div>`;
  }
}

async function renderFollowing(){
  const list = getFollowing();
  app.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>الفرق اللي بتتابعها</h2>
        <button class="tab-btn" id="enableNotifBtn"><i class="fa-solid fa-bell"></i> فعّل التنبيهات</button>
      </div>
      <div id="followingList"></div>
    </div>
  `;
  document.getElementById('enableNotifBtn').addEventListener('click', ()=>{
    if('Notification' in window) Notification.requestPermission();
  });
  const box = document.getElementById('followingList');
  box.innerHTML = list.length ? list.map(t=>`
    <div class="match-list-row" style="cursor:pointer;" onclick="location.hash='#/team/${t.id}'">
      <div class="match-teams" style="flex-direction:row;align-items:center;gap:.6rem;">
        <img src="${t.crest||''}" style="width:24px;height:24px;object-fit:contain;" onerror="this.style.display='none'">
        <span>${t.name}</span>
      </div>
      <i class="fa-solid fa-chevron-left" style="color:var(--ink-dim);"></i>
    </div>
  `).join('') : `<div class="empty"><i class="fa-solid fa-star"></i> لسه ماتابعتش أي فريق. دور على فريق من البحث وتابعه عشان توصلك تنبيهات أهدافه.</div>`;
}

const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let searchTimeout;
searchInput.addEventListener('input', ()=>{
  clearTimeout(searchTimeout);
  const q = searchInput.value.trim();
  if(q.length < 2){ searchResults.classList.remove('show'); return; }
  searchTimeout = setTimeout(()=>doSearch(q), 300);
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-wrap')) searchResults.classList.remove('show');
});

function doSearch(q){
  const teamsMap = new Map();
  allMatchesCache.forEach(m=>{
    [m.homeTeam, m.awayTeam].forEach(t=>{
      if(t.name.toLowerCase().includes(q.toLowerCase()) || (t.shortName||'').toLowerCase().includes(q.toLowerCase())){
        teamsMap.set(t.id, t);
      }
    });
  });
  const results = Array.from(teamsMap.values());
  if(!results.length){
    searchResults.innerHTML = `<div class="search-result-item" style="cursor:default;color:var(--ink-dim);">مفيش نتائج ضمن مباريات اليوم</div>`;
  }else{
    searchResults.innerHTML = results.map(t=>`
      <div class="search-result-item" onclick="location.hash='#/team/${t.id}'; searchResults.classList.remove('show'); searchInput.value='';">
        <img src="${t.crest||''}" onerror="this.style.display='none'">${t.shortName||t.name}
      </div>
    `).join('');
  }
  searchResults.classList.add('show');
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  document.getElementById('installBanner').classList.remove('show');
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
});
document.getElementById('installClose').addEventListener('click', ()=>{
  document.getElementById('installBanner').classList.remove('show');
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

router();
setInterval(()=>{ if(parseHash().route==='home') loadFeaturedAndTicker(); }, 90000);
setInterval(checkFollowedGoals, 60000);
</script>
